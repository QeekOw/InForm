name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 is the floor in pyproject and the base image in the Dockerfile.
      # Testing on it is what catches syntax the deployed image cannot run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r backend/requirements.txt

      # The Donut checkpoint and the training extra are not available here, so
      # the checkpoint round-trip test skips. Everything else must pass.
      - name: Tests
        run: pytest -q
