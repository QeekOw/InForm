name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inform_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      # 3.11 is the floor in pyproject and the base image in the Dockerfile.
      # Testing on it is what catches syntax the deployed image cannot run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r backend/requirements.txt

      - name: Initialize test database
        working-directory: backend
        run: alembic upgrade head

      # The Donut checkpoint and the training extra are not available here, so
      # the checkpoint round-trip test skips. Everything else must pass.
      - name: Tests
        run: pytest -q
