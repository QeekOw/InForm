[project]
name = "cera"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openai>=1.40",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Heavy (GPU-oriented) deps for Donut fine-tuning — kept out of the base
# install so the extraction seam (Module 1's runtime path) stays light.
training = [
    "torch>=2.4",
    "transformers>=4.40",
    "accelerate>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cera.synthetic" = ["templates/*.html"]
