[project]
name = "inform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openai>=1.40",
    "Pillow>=10",
    # inform.preprocess masks the sheet out of a photo before the engine sees
    # it; percentiles over a pixel mask are not something Pillow does well.
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Heavy (GPU-oriented) deps for Donut fine-tuning — kept out of the base
# install so the extraction seam (Module 1's runtime path) stays light.
training = [
    "torch>=2.4",
    "transformers>=4.40",
    "accelerate>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inform.synthetic" = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
# Only collect the project's own tests; never walk downloaded checkpoints under
# models/ (a Kaggle dump there ships an old repo's tests that fail to import).
testpaths = ["tests"]

