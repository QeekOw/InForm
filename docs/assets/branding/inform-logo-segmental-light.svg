<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Icon Mint/Teal Gradient for Light Mode -->
    <linearGradient id="brandGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Squircle for light mode -->
    <linearGradient id="squircleGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .brand-title-light {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: 82px;
      letter-spacing: -2px;
      fill: #0F172A;
    }
    .brand-title-accent-light {
      fill: url(#brandGradLight);
    }
    .brand-tagline-light {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: #64748B;
    }
  </style>

  <!-- Clean Transparent or Crisp Card Background -->
  <rect width="800" height="240" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- App Icon Squircle Container -->
  <g transform="translate(48, 36)" filter="url(#cardShadow)">
    <rect width="168" height="168" rx="42" fill="url(#squircleGradLight)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- InForm Segmental Human Symbol -->
    <g transform="translate(84, 84)">
      <!-- Head -->
      <circle cx="0" cy="-44" r="11" fill="url(#brandGradLight)" />
      
      <!-- Torso / Core -->
      <path d="M -3, -27 C -1, -15 -2, 5 0, 18 C 2, 5 1, -15 3, -27 Z" fill="url(#brandGradLight)" stroke="url(#brandGradLight)" stroke-width="6" stroke-linejoin="round" />

      <!-- Left Arm Segment -->
      <path d="M -6, -24 Q -28, -38 -52, -26" fill="none" stroke="url(#brandGradLight)" stroke-width="7" stroke-linecap="round" />

      <!-- Right Arm Segment -->
      <path d="M 6, -24 Q 28, -38 52, -26" fill="none" stroke="url(#brandGradLight)" stroke-width="7" stroke-linecap="round" />

      <!-- Left Leg Segment -->
      <path d="M -4, 18 L -36, 62" fill="none" stroke="url(#brandGradLight)" stroke-width="7.5" stroke-linecap="round" />

      <!-- Right Leg Segment -->
      <path d="M 4, 16 L 24, 28 L 38, 28" fill="none" stroke="url(#brandGradLight)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 12, 30 L 26, 62" fill="none" stroke="url(#brandGradLight)" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>

  <!-- Brand Typography Lockup -->
  <g transform="translate(252, 126)">
    <text class="brand-title-light">
      In<tspan class="brand-title-accent-light">Form</tspan>
    </text>
    <text y="42" class="brand-tagline-light">
      Precision Body Scan &amp; AI
    </text>
  </g>
</svg>
